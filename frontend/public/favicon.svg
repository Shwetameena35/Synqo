<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <!-- Synqo Signature Orange Gradient -->
    <linearGradient id="synqo-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF7A45" />
      <stop offset="50%" stop-color="#FF5216" />
      <stop offset="100%" stop-color="#D93800" />
    </linearGradient>

    <!-- Top Specular Sheen -->
    <linearGradient id="synqo-sheen" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.3" />
      <stop offset="60%" stop-color="#FFFFFF" stop-opacity="0.0" />
    </linearGradient>

    <!-- Inner Stroke Glow -->
    <linearGradient id="synqo-border" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFAE8A" stop-opacity="0.7" />
      <stop offset="100%" stop-color="#B32B00" stop-opacity="0.4" />
    </linearGradient>

    <filter id="synqo-shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="2.5" flood-color="#000000" flood-opacity="0.4" />
    </filter>
  </defs>

  <!-- Base Squircle -->
  <rect x="2" y="2" width="60" height="60" rx="15" fill="url(#synqo-bg)" filter="url(#synqo-shadow)" />
  <rect x="2" y="2" width="60" height="30" rx="15" fill="url(#synqo-sheen)" />
  <rect x="2.5" y="2.5" width="59" height="59" rx="14.5" fill="none" stroke="url(#synqo-border)" stroke-width="1.2" />

  <!-- Synqo Layers & API Sync Glyph -->
  <g fill="none" stroke="#FFFFFF" stroke-linecap="round" stroke-linejoin="round">
    <!-- Top Layer (Solid filled card with crisp edges) -->
    <polygon points="32 13 49 22 32 31 15 22" fill="#FFFFFF" stroke="#FFFFFF" stroke-width="2.5" />
    <!-- Top Layer Inner Accent -->
    <polygon points="32 16 43 22 32 28 21 22" fill="#FF5216" opacity="0.15" />

    <!-- Middle Sync Layer -->
    <polyline points="15 33 32 42 49 33" stroke-width="4.5" />

    <!-- Foundation Mock & Execution Layer -->
    <polyline points="15 44 32 53 49 44" stroke-width="4.5" />
  </g>
</svg>