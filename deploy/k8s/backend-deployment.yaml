apiVersion: apps/v1
kind: Deployment
metadata:
  name: apihub-backend
  namespace: api-playground-hub
  labels:
    app: apihub-backend
spec:
  replicas: 3
  selector:
    matchLabels:
      app: apihub-backend
  template:
    metadata:
      labels:
        app: apihub-backend
    spec:
      containers:
        - name: backend
          image: apihub-backend:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
          envFrom:
            - configMapRef:
                name: apihub-config
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: apihub-backend-service
  namespace: api-playground-hub
spec:
  selector:
    app: apihub-backend
  ports:
    - protocol: TCP
      port: 8080
      targetPort: 8080
  type: ClusterIP
